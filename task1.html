<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Task 0 & 1</title>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 500px;">
        <h3 class="text-center mb-4">Contact Us</h3>
        <form action="#" class="cl">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold" >Name</label>
                <input type="text" placeholder="Input name" class="form-control" name="username" id="username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email</label>
                <input type="email" placeholder="Input email" class="form-control" name="email" id="email" required>
            </div>
            <div class="mb-3">
                <label for="msg" class="form-label fw-bold">Message</label>
                <textarea name="message" id="msg" class="form-control" rows="4" maxlength="200" required></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100">Submit</button>
        </form>
    </div>
</body>
</html>
